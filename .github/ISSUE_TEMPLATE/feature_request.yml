name: Feature request
description: Suggest a focused improvement
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: Keep the proposal focused on the project's current scope.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
