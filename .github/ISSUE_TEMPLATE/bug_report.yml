name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version, shell and any other relevant details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or extra context
      description: Remove secrets before posting logs or configuration.
