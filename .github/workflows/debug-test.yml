name: One-shot test diagnostics

on:
  push:
    branches:
      - fix/history-concurrency-privacy
    paths:
      - .github/workflows/debug-test.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/history-concurrency-privacy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Capture tests
        shell: bash
        run: |
          set +e
          cargo test --locked --all-features -- --nocapture > ci-test.log 2>&1
          status=$?
          echo "exit_status=$status" >> ci-test.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-test.log
          git commit -m "ci: capture failing BuildTimer test output"
          git push origin HEAD:fix/history-concurrency-privacy
