[package]
name = "buildtimer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Measure build and test command durations and compare them with previous local runs."
repository = "https://github.com/BLCCoreStudio/BuildTimer"
license = "MIT"
readme = "README.md"
keywords = ["build", "benchmark", "cli", "developer-tools", "timing"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
